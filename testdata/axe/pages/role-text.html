<!DOCTYPE html>
<html lang="en"><head><title>role text</title></head>
<body><main>
<span role="text">Hello <b>bold</b></span>
<a href="/x"><span role="text">Link</span> <span role="text">text</span></a>
<div role="text" tabindex="0">Focusable text</div>
<button><span role="text">One</span><span role="text">Two</span></button>
<h1><span role="text">Head</span></h1>
<div role="text" aria-label="Labelled text">inner</div>
</main></body></html>
