<!DOCTYPE html>
<html lang="en"><head><title>Template in a list</title></head>
<body><main>
<ul><li>a</li><template><li>t1</li><li>t2</li></template><li>b</li></ul>
<ol><template><li>only template</li></template></ol>
<dl><template><dt>t</dt><dd>d</dd></template><dt>real</dt><dd>d</dd></dl>
<table><template><tr><td>cell</td></tr></template><tr><td>real</td></tr></table>
<select><template><option>t</option></template><option>real</option></select>
<div><template><button>no name</button></template></div>
</main></body></html>
