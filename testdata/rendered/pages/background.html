<!DOCTYPE html>
<html lang="en">
<head><meta charset="utf-8"><title>Text over backgrounds</title>
<style>
  body { margin: 0; font: 20px sans-serif; }
  .hero { width: 400px; height: 120px; color: #fff; padding: 10px; box-sizing: border-box; }
  #solid { background-color: #003366; }
  #image { background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='40' height='40'><rect width='40' height='40' fill='%23888'/><circle cx='20' cy='20' r='10' fill='%23ccc'/></svg>"); }
  #gradient { background-image: linear-gradient(90deg, #000, #fff); }
  #translucent { background-color: rgba(0, 0, 0, 0.5); }
  #behind { position: relative; }
  #behind::before { content: ""; position: absolute; inset: 0; background: #900; z-index: -1; }
  #overlay { position: absolute; left: 0; top: 0; width: 100px; height: 40px; background: rgba(255,255,255,0.8); }
</style>
</head>
<body>
<div id="solid" class="hero">White on dark blue</div>
<div id="image" class="hero">Text over an image background</div>
<div id="gradient" class="hero">Text over a gradient</div>
<div id="translucent" class="hero">Translucent background</div>
<div id="behind" class="hero">Background from a pseudo-element behind</div>
<div id="overlay">Overlay</div>
</body>
</html>
