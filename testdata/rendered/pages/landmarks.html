<!DOCTYPE html>
<html lang="en">
<head><meta charset="utf-8"><title>Links, lists and landmarks</title>
<style>body { margin: 8px; font: 14px sans-serif; } nav ul { list-style: none; padding: 0; } nav li { display: inline-block; margin-right: 8px; } a:focus { outline: 2px solid #f90; } .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }</style>
</head>
<body>
<a class="sr" href="#main" id="skip">Skip to content</a>
<header><h1>Site</h1><nav aria-label="Main"><ul><li><a href="/a">A</a></li><li><a href="/b">B</a></li></ul></nav></header>
<main id="main"><h2>Main</h2><p>Paragraph with <a href="/c">a link</a>.</p><button id="b1" tabindex="0">Go</button><div id="tab" tabindex="-1">Programmatic focus only</div></main>
<footer><p>Footer</p></footer>
</body>
</html>
