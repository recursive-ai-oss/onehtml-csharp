<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Whitespace</title>
  <style>body { margin: 8px; font: 14px sans-serif; } .pre { white-space: pre; } .wrap { width: 200px; }</style>
</head>

<body>

  <div id="a">
    <span id="s1">one</span>
    <span id="s2">two</span>

    <!-- a comment -->

  </div>

  <pre id="pre">
  line 1
    line 2
</pre>
  <p id="wrap" class="wrap">A long paragraph that wraps over several lines in a narrow column so that the text is split into several boxes by the line breaker, and a   run   of   spaces   collapses.</p>
  <p id="nbsp">a&nbsp;&nbsp;b &#x1F600; emoji and combining e&#x301;</p>
  <p id="ws">   </p>
  <ul>
    <li>x</li>
    <li>y</li>
  </ul>
  <table id="t">
    <tr>
      <td>cell</td>
    </tr>
  </table>

</body>
</html>
