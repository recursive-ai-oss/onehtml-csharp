<!DOCTYPE html>
<html lang="en">
<head><meta charset="utf-8"><title>Wrapped text</title>
<style>body { margin: 8px; font: 16px/1.5 serif; } #narrow { width: 160px; } a { color: #05c; }</style>
</head>
<body>
<p id="narrow">The quick brown fox jumps over the lazy dog and keeps running until the line breaker has split this paragraph into at least four separate lines of text.</p>
<p id="inline">Text with <a href="#x" id="link">a link that sits in the middle</a> of the sentence, <em>emphasis</em> and <strong>strong</strong> words.</p>
<p id="rtl" dir="rtl">Right to left paragraph</p>
<p id="vertical" style="writing-mode: vertical-rl; height: 100px">Vertical</p>
</body>
</html>
