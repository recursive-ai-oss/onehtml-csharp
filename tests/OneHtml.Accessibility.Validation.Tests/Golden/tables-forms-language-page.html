<!DOCTYPE html>
<html lang="en-US-GB" xml:lang="fr">
<head><title>Golden page: tables, forms, language</title></head>
<body>
<table summary="Opening hours">
  <caption>Opening hours</caption>
  <tr><td colspan="3">Weekly schedule</td></tr>
  <tr><th scope="column">Day</th><th></th><th scope="col">Afternoon</th></tr>
  <tr><td>Mon</td><td>8-12</td><td headers="nothere">14-17</td></tr>
  <tr><td>Tue</td><td>8-12</td><td>14-17</td></tr>
</table>
<table>
  <tr><th id="h1">Item</th><th id="h2">Price</th></tr>
  <tr><td headers="h1">Pen</td><td headers="h2 h2x">2</td></tr>
</table>
<table>
  <tr><td colspan="2">Sales by quarter</td></tr>
  <tr><th>Q1</th><th>Q2</th></tr>
  <tr><td>1</td><td>2</td></tr>
</table>
<form>
  <input type="text" name="e" autocomplete="work email">
  <input type="text" name="s" autocomplete="shiping street-address">
  <input type="text" name="x" autocomplete="home photo">
</form>
<p lang="dutch">Zij liepen een vreemde Tiki bar binnen.</p>
<p lang="fr-CH">Ils ont trouv&eacute; un &eacute;trange bar Tiki.</p>
</body>
</html>
